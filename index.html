<!DOCTYPE html>
<html>
<head>
    <title>Validación de Certificado - Mineduc</title>
    </head>
<body>

    <div id="pantalla-validacion">
        <h1 style="color: #00529b;">AyudaMineduc</h1>
        <h2>Certificados en tu Celular</h2>
        <p>Estimado Usuario(a): Complete el desafío Recaptcha para continuar...</p>
        
        <button onclick="mostrarCertificado()">☑ No soy un robot</button>
    </div>

    <div id="visor-pdf" style="display: none; background-color: #333; height: 100vh;">
        <p style="color: white; text-align: center;">Verifique que el certificado presentado contenga la misma información...</p>
        <iframe src="ESTUDIOS-CARLOS-ALEXIS-STEVENSON-ROLDAN.pdf" width="100%" height="80%"></iframe>
    </div>

    <script>
        function mostrarCertificado() {
            // Oculta la pantalla del captcha
            document.getElementById('pantalla-validacion').style.display = 'none';
            // Muestra la pantalla del PDF
            document.getElementById('visor-pdf').style.display = 'block';
        }
    </script>
</body>
</html>
